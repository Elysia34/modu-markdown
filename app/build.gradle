plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wbx.mdreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.wbx.mdreader"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "2.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
